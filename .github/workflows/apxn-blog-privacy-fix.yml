name: APXN Blog Public Content Correction

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - ".github/workflows/apxn-blog-privacy-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct-published-article-and-editorial-rules:
    if: ${{ github.ref == 'refs/heads/cloudflare-migration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out APXN website
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct published article and prevent internal disclosures
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """One-time APXN article correction and public-editorial safety gate.
          Run from repository root on the cloudflare-migration branch.
          """
          import json
          import re
          from pathlib import Path
          
          ROOT = Path.cwd()
          MANIFEST = ROOT / 'data/blog-articles.json'
          ARTICLE_HTML = ROOT / 'blog/articles/apxn-network-shares-infrastructure-migration-progress-and-verified-points-level-updates.html'
          RESEARCHER = ROOT / 'scripts/blog-researcher.mjs'
          WRITER = ROOT / 'scripts/blog-writer.mjs'
          CONFIG = ROOT / 'data/blog-config.json'
          KNOWLEDGE = ROOT / 'data/apxn-blog-knowledge.json'
          
          for path in (MANIFEST, ARTICLE_HTML, RESEARCHER, WRITER, CONFIG, KNOWLEDGE):
              if not path.exists():
                  raise SystemExit(f'Required file is missing: {path}')
          
          new_title = 'APXN Network Updates Seven Verified Points Levels and Community Rewards'
          new_description = ('Apex Network explains the seven verified APXN Points levels, the 63 million APXN community allocation, '
                             'and the planned Membership and Loyalty rewards.')
          new_keywords = ['APXN Network', 'Verified APXN Points', 'seven reward levels', 'APXN community allocation',
                          '63 million APXN', 'APXN Membership and Loyalty', 'APXN airdrops', 'APXN roadmap']
          
          intro = ("Apex Network has published an updated explanation of its seven-level community rewards framework. "
                   "The levels are determined by verified APXN Points, helping participants understand how their "
                   "qualifying activity relates to the community distribution structure. APXN Points are participation "
                   "points in the current ecosystem and should not be confused with transferable APXN tokens. "
                   "The official token allocation reserves 63 million APXN for the community, divided among seven "
                   "levels. Individual token allocations, eligibility checks, and withdrawal procedures remain "
                   "subject to the official rules and announcements for their respective stages.")
          
          sections = [
              ('How the Seven APXN Levels Work', [
                  "Each account is assigned a community level according to its verified APXN Points balance. The seven tiers start at 20,000 points and continue upward to the highest level, which begins at 1,000,000 verified points. The level framework uses the verified balance rather than the total of unverified activity. A user who has not reached the minimum for Level 1 has not entered the seven-level distribution structure. These thresholds describe level classification, not an immediate ability to withdraw tokens.",
                  "The published threshold for each level is a minimum that the account must actually meet. A balance containing decimal points is assessed against the full minimum without rounding it upward. A level can change when the verified balance reaches a higher threshold under the project rules. Keeping the level rule separate from token distribution helps participants distinguish current APXN Points activity from planned token rewards. Users should rely on official project announcements for the timing and eligibility requirements of any future claim."
              ]),
              ('Verified Points Thresholds from L1 to L7', [
                  "Level 1 covers 20,000 to fewer than 50,000 verified APXN Points. Level 2 covers 50,000 to fewer than 100,000 points. Level 3 covers 100,000 to fewer than 150,000 points. Level 4 covers 150,000 to fewer than 250,000 points. Each range includes its minimum but excludes the next level's minimum. This means that reaching 150,000 verified points qualifies an account for Level 4 rather than Level 3, assuming the account meets all applicable program conditions.",
                  "Level 5 covers 250,000 to fewer than 450,000 verified points. Level 6 covers 450,000 to fewer than 1,000,000 verified points. Level 7 begins at 1,000,000 verified points, with no higher level currently defined in the seven-tier structure. These boundaries supersede the incorrect figures previously shown in this article. The framework offers a consistent way to describe verified points levels, while actual token allocations and claim availability will be addressed through separate official announcements."
              ]),
              ('Understanding the 63 Million APXN Community Allocation', [
                  "The approved APXN tokenomics reserve 63,000,000 APXN, representing 63 percent of the total 100,000,000 APXN supply, for community allocation. This community share is organized across the seven verified-points levels. The seven levels do not imply seven identical token pools or an equal payment to every account. Each level has its own allocation, and the distribution terms are intended to reflect eligible participants' verified points within that level. Detailed allocation amounts for the separate tiers will be announced officially before distribution.",
                  "Within each level, eligible users share that level's designated pool proportionally to their verified APXN Points. An account holding more verified points than another account in the same level would have a larger proportional share, subject to the final published program conditions. This method is different from dividing the whole community supply equally among all participants. It also does not establish a fixed exchange rate between APXN Points and APXN tokens. Final eligibility, token allocation, and withdrawal rules remain tied to the relevant future stages of the project."
              ]),
              ('APXN Points and APXN Tokens Are Different', [
                  "APXN Points reflect participation within the current Apex Network community experience. The Telegram Mini App includes mining-style points claims, daily participation, referrals, and other available tasks. Points shown in the application are not an immediately transferable cryptocurrency balance. The APXN token is a separate project asset described in the official token information. Understanding this distinction helps prevent misunderstandings about what users can do today and what depends on future program activation.",
                  "The seven-level framework is a method for evaluating participation and planning community allocation, not a live token withdrawal feature. Distribution, wallet requirements, and token claims will follow the rules applicable when those services are officially introduced. Participants should avoid assuming that every point already has a cash value or that an expected token amount is guaranteed. Official communications will identify which features are currently active and which are scheduled for later phases of the roadmap."
              ]),
              ('Membership and Loyalty KYC Rewards', [
                  "Apex Network plans to launch its Membership and Loyalty KYC program in the first quarter of 2027. Under the announced program, eligible accounts that complete the required tasks and Telegram Stars payment can receive a one-time reward of 20,000 verified APXN Points. The verified-points completion reward is planned to continue for qualifying accounts even after the limited first-airdrop allocation is exhausted. The program concerns the relevant Telegram account and its eligibility under the published rules; it should not be confused with a claim that token withdrawals are already available.",
                  "The first 10,000 qualifying participants in the program are also expected to receive a limited allocation of 100 APXN per eligible account, under the official terms. That allocation is separate from the 20,000 verified-points reward. Planned claims for the first airdrop are targeted for the second quarter of 2027 rather than immediate transfer when the KYC tasks are completed. Requirements and deadlines will be communicated through official Apex Network channels so that users can check the conditions before taking part."
              ]),
              ('What Participants Can Expect Next', [
                  "The project roadmap places community participation, points activity, and core application improvements in the current development stage. Future phases include the planned Membership and Loyalty program, airdrop claims, platform development, and network milestones. These items should be read as targets until the project confirms that each feature is live. A roadmap announcement does not mean that an exchange listing, token distribution, or withdrawal service has already opened. Users are encouraged to follow the official website and communication channels for confirmed changes.",
                  "For participants, the practical first step is to understand their verified APXN Points balance and the corresponding level threshold. They can then review future eligibility instructions when published, rather than treating their current level as a completed token payout. The team will continue to distinguish current app functions from future token programs in official communications. This public update is intended to clarify the community reward structure in clear terms for all participants."
              ])
          ]
          
          faq = [
              ('What are the minimum verified APXN Points for each level?',
               'The thresholds are L1 at 20,000; L2 at 50,000; L3 at 100,000; L4 at 150,000; L5 at 250,000; L6 at 450,000; and L7 at 1,000,000 verified APXN Points. Each level applies from its minimum up to, but not including, the next threshold.'),
              ('Does reaching a level mean APXN tokens can be withdrawn now?',
               'No. Verified APXN Points determine community-level classification. APXN Points are separate from APXN tokens, and the project has not activated token withdrawals through this level system. Official distribution and withdrawal instructions will be announced for the relevant future stages.'),
              ('How is the 63 million APXN community allocation distributed?',
               'The community allocation is organized across seven levels, with a dedicated pool for each level. Within a level, eligible accounts are allocated rewards proportionally to their verified points under the final published rules. Detailed amounts and claim requirements will be confirmed in official announcements.')
          ]
          
          conclusion = ("Apex Network's community framework uses seven clearly defined levels based on verified APXN Points, "
                        "beginning at 20,000 points for L1 and 1,000,000 points for L7. The project has allocated "
                        "63 million APXN to the community under its approved tokenomics, with proportional distribution "
                        "within each level subject to the final program rules. Membership and Loyalty KYC and airdrop "
                        "claims remain future roadmap stages. The essential distinction is that participation points, "
                        "community-level classification, and transferable tokens are not the same thing.")
          
          manifest = json.loads(MANIFEST.read_text(encoding='utf-8'))
          rec = next((a for a in manifest['articles'] if a.get('id') == 'apxn-019'), None)
          if not rec:
              raise SystemExit('Could not locate article apxn-019')
          old = rec['content']
          if len(old['sections']) != 6 or len(old['faq']) != 3:
              raise SystemExit('Unexpected article structure; aborting without replacing text')
          
          new = {
              'title': new_title,
              'description': new_description,
              'keywords': new_keywords,
              'intro': {'text': intro, 'evidence_ids': []},
              'sections': [{'heading': heading, 'paragraphs': [{'text': p, 'evidence_ids': []} for p in paragraphs]}
                           for heading, paragraphs in sections],
              'faq': [{'question': question, 'answer': answer, 'evidence_ids': []}
                      for question, answer in faq],
              'conclusion': {'text': conclusion, 'evidence_ids': []}
          }
          
          # Modify the already published HTML without changing its design or canonical URL.
          html = ARTICLE_HTML.read_text(encoding='utf-8')
          
          def escape_html(value):
              return str(value).replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;').replace("'", '&#039;')
          
          def replace_visible(original, replacement):
              global html
              # HTML body, metadata, JSON-LD and social preview text should agree.
              candidates = [(str(original), str(replacement)), (escape_html(original), escape_html(replacement))]
              for a, b in candidates:
                  if a in html:
                      html = html.replace(a, b)
          
          for original, replacement in [(rec['title'], new_title), (rec['description'], new_description),
                                        (', '.join(rec['keywords']), ', '.join(new_keywords))]:
              replace_visible(original, replacement)
          replace_visible(old['intro']['text'], intro)
          for i, (heading, paragraphs) in enumerate(sections):
              replace_visible(old['sections'][i]['heading'], heading)
              for j, paragraph in enumerate(paragraphs):
                  replace_visible(old['sections'][i]['paragraphs'][j]['text'], paragraph)
          for i, (question, answer) in enumerate(faq):
              replace_visible(old['faq'][i]['question'], question)
              replace_visible(old['faq'][i]['answer'], answer)
          replace_visible(old['conclusion']['text'], conclusion)
          
          new_image = 'https://apxn.network/logo2%20(1).png'
          if rec.get('image'):
              html = html.replace(rec['image'], new_image)
          
          # Scan the public document including SEO, HTML text and structured data.
          private_patterns = [r'cloudflare', r'vercel', r'apxn-miner-preview', r'apxn-miner-live',
                              r'cloudflare-migration\b', r'\bworker execution\b',
                              r'\bruntime environment variables\b', r'\bgithub repository\b',
                              r'\btesting environment\b', r'\bhosting provider\b']
          for pattern in private_patterns:
              if re.search(pattern, html, re.I):
                  raise SystemExit(f'Still contains prohibited operational text in HTML: {pattern}')
          ARTICLE_HTML.write_text(html, encoding='utf-8')
          
          body = ' '.join([intro] + [p for _, pair in sections for p in pair] + [answer for _, answer in faq] + [conclusion])
          rec.update({
              'title': new_title, 'description': new_description, 'excerpt': new_description,
              'keywords': new_keywords, 'content': new, 'image': new_image, 'image_filename': '',
              'source': 'official_apxn_public_editorial_update',
              'word_count': len(body.split()), 'reading_minutes': max(1, (len(body.split()) + 219) // 220),
              'seo_ready': True, 'facts_verified': True, 'quality_check': True,
              'updated_at': '2026-11-15',
          })
          rec['seo']['title'] = new_title
          rec['seo']['description'] = new_description
          manifest['last_updated'] = '2026-11-15'
          MANIFEST.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          
          # Prevent future APXN article generation from using internal operations.
          ops_regex = r'/\b(?:cloudflare|vercel|workers?\.dev|github(?:\s+actions?|\s+repository)?|webhooks?|runtime\s+configuration|environment\s+variables?|preview\s+environment|test(?:ing)?\s+bot|staging|production\s+server|(?:test|preview|internal|site|application|production)\s+deploy(?:ed|ment|ments)?|hosting\s+(?:provider|migration)|infrastructure\s+migration|worker\s+execution|apxn-miner-(?:preview|live)|cloudflare-migration|internal\s+(?:branch|server|analytics)|api\s+keys?|secrets?)\b/i'
          
          researcher = RESEARCHER.read_text(encoding='utf-8')
          if 'PUBLIC_SITE_OPERATIONS_PATTERN' not in researcher:
              anchor = 'const GLOBAL_FORBIDDEN_CLAIMS = ['
              assert anchor in researcher
              researcher = researcher.replace(anchor,
                  '// Confidential infrastructure information is not public news evidence.\n'
                  f'const PUBLIC_SITE_OPERATIONS_PATTERN = {ops_regex};\n\n' + anchor, 1)
              anchor = 'if (!clean || wordCount(clean) < 2) continue;'
              assert anchor in researcher
              researcher = researcher.replace(anchor, anchor +
                  '\n      if (PUBLIC_SITE_OPERATIONS_PATTERN.test(clean)) continue;', 1)
              anchor = '"Do not pad the article with repetition, generic motivational language or unsupported examples merely to reach a word count."'
              assert anchor in researcher
              researcher = researcher.replace(anchor, anchor + ',\n  "Never publish APXN hosting platforms, repository identifiers, test bots, deployment stages, branch names, analytics, error logs, environment setup or internal operation details."', 1)
              RESEARCHER.write_text(researcher, encoding='utf-8')
          
          writer = WRITER.read_text(encoding='utf-8')
          if 'PUBLIC_SITE_OPERATIONS_PATTERN' not in writer:
              anchor = 'function paidWriterInstructions() {'
              assert anchor in writer
              gate = ('// APXN public articles must not expose internal operational infrastructure.\n'
                      f'const PUBLIC_SITE_OPERATIONS_PATTERN = {ops_regex};\n\n'
                      'function publicArticleText(article) {\n'
                      '  return [article?.title, article?.description, ...(article?.keywords || []),\n'
                      '    ...(article?.sections || []).map(s => s?.heading),\n'
                      '    ...(article?.faq || []).map(f => f?.question), articleBodyText(article)]\n'
                      '    .filter(Boolean).join("\\n");\n'
                      '}\n\n')
              writer = writer.replace(anchor, gate + anchor, 1)
              anchor = '"Use a neutral educational tone suitable for a high-quality public blog.",'
              assert anchor in writer
              writer = writer.replace(anchor, anchor +
                  '\n    "Do not reveal APXN hosting platforms, deployment names, repository details, preview bots, branches, runtime setup, internal metrics or other operational information. Public-facing product and reward information only.",', 1)
              anchor = 'const bodyWords = wordCount(bodyText);\n\n  if (packet.status'
              assert anchor in writer
              writer = writer.replace(anchor,
                  'const bodyWords = wordCount(bodyText);\n\n'
                  '  if (["apxn", "hybrid"].includes(packet?.topic?.content_mode) &&\n'
                  '      PUBLIC_SITE_OPERATIONS_PATTERN.test(publicArticleText(article))) {\n'
                  '    errors.push("Article reveals internal hosting, deployment, monitoring or repository details.");\n'
                  '  }\n\n  if (packet.status', 1)
              WRITER.write_text(writer, encoding='utf-8')
          
          config = json.loads(CONFIG.read_text(encoding='utf-8'))
          config['editorial_rules'].update({
              'forbid_internal_infrastructure_details': True,
              'forbid_hosting_vendor_mentions_in_apxn_news': True,
              'forbid_deployment_preview_branch_and_metrics_details': True,
              'require_public_facing_user_value': True
          })
          CONFIG.write_text(json.dumps(config, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          knowledge = json.loads(KNOWLEDGE.read_text(encoding='utf-8'))
          rule = ('Never publish confidential or internal APXN hosting or deployment information, platform vendor names, '
                  'test environments, branch names, repository configuration, traffic or error metrics, or operational status. '
                  'Only publish user-facing confirmed updates, official tokenomics, verified APXN Points rules and roadmap stages.')
          if rule not in knowledge['automation_editorial_rules']:
              knowledge['automation_editorial_rules'].append(rule)
          KNOWLEDGE.write_text(json.dumps(knowledge, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          
          print(f'Corrected published article {rec["id"]}: {new_title}')
          print(f'Body words: {rec["word_count"]}')
          print('Publication privacy gate: ENFORCED')
          print('Existing article canonical URL: PRESERVED')
          PY
      - name: Validate article generator and rebuild public index
        run: |
          set -euo pipefail
          node --check scripts/blog-writer.mjs
          node --check scripts/blog-researcher.mjs
          python3 -m json.tool data/blog-articles.json >/dev/null
          python3 -m json.tool data/blog-config.json >/dev/null
          python3 -m json.tool data/apxn-blog-knowledge.json >/dev/null
          node scripts/blog-sync.mjs
          ! grep -Eiq 'Cloudflare|Vercel|apxn-miner-preview|apxn-miner-live' blog/articles/apxn-network-shares-infrastructure-migration-progress-and-verified-points-level-updates.html
      - name: Save corrected blog to Cloudflare migration branch
        run: |
          set -euo pipefail
          git config user.name "APXN Blog Bot"
          git config user.email "actions@github.com"
          git add data/blog-articles.json data/blog-config.json data/apxn-blog-knowledge.json scripts/blog-researcher.mjs scripts/blog-writer.mjs blog/articles/apxn-network-shares-infrastructure-migration-progress-and-verified-points-level-updates.html blog/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi
          git commit -m "fix(blog): remove internal infrastructure disclosures and correct APXN levels"
          git pull --rebase origin cloudflare-migration
          git push origin HEAD:cloudflare-migration

