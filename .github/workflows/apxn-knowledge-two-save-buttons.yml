name: APXN Knowledge Bank - Two Separate Save Buttons

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - ".github/workflows/apxn-knowledge-two-save-buttons.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apxn-knowledge-two-buttons-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  add-two-actions:
    if: ${{ github.ref == 'refs/heads/cloudflare-migration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing dashboard
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Install separate create-article and AI-writer save actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          TARGET = Path('blog-admin/index.html')
          html = TARGET.read_text(encoding='utf-8')

          OLD_BUTTON = re.compile(
              r'<button\s+id="knowledge-save-button"\s+class="knowledge-save-button"\s+'
              r'type="submit"\s*>\s*(?:حفظ في بنك معلومات APXN|حفظ في نظام بنك معلومات الكاتب الآلي)\s*</button>',
              re.S,
          )

          BUTTONS = '''<!-- APXN_KNOWLEDGE_TWO_BUTTONS: BEGIN -->
                              <div class="apxn-knowledge-dual-actions" style="display:flex;flex-wrap:wrap;gap:12px;margin:14px 0">
                                  <button
                                      id="knowledge-create-article-button"
                                      class="knowledge-save-button"
                                      style="background:#facc15;color:#0f172a;flex:1 1 240px;cursor:pointer"
                                      type="button"
                                  >
                                      حفظ في إنشاء مقالة جديدة
                                  </button>
                                  <button
                                      id="knowledge-save-button"
                                      class="knowledge-save-button"
                                      style="flex:1 1 240px;cursor:pointer"
                                      type="submit"
                                  >
                                      حفظ في نظام بنك معلومات الكاتب الآلي
                                  </button>
                              </div>
                              <!-- APXN_KNOWLEDGE_TWO_BUTTONS: END -->'''

          if '<!-- APXN_KNOWLEDGE_TWO_BUTTONS: BEGIN -->' in html:
              assert html.count('<!-- APXN_KNOWLEDGE_TWO_BUTTONS: BEGIN -->') == 1
              assert html.count('<!-- APXN_KNOWLEDGE_TWO_BUTTONS: END -->') == 1
              html = re.sub(r'<!-- APXN_KNOWLEDGE_TWO_BUTTONS: BEGIN -->[\s\S]*?<!-- APXN_KNOWLEDGE_TWO_BUTTONS: END -->',
                            BUTTONS, html, count=1)
          else:
              html, number = OLD_BUTTON.subn(lambda _: BUTTONS, html, count=1)
              assert number == 1, 'Original knowledge save button was not found exactly once'

          # Keep the existing automatic-writer submission exactly as it works now.
          # This string is the old handler's finally reset label, not a new action.
          html = html.replace("'حفظ في بنك معلومات APXN';", "'حفظ في نظام بنك معلومات الكاتب الآلي';")

          BRIDGE_JS = r'''  /* APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: BEGIN */
            // The yellow button never submits to the automatic-writer knowledge endpoint.
            // It opens the existing article editor with the submitted content prefilled.
            function knowledgeSections(text, suppliedTitle) {
              const raw = String(text || '').replace(/\r\n?/g, '\n');
              const lines = raw.split('\n').map(line => line.trim());
              let firstLineIsTitle = false;
              const firstNonempty = lines.findIndex(line => line.length > 0);
              if (firstNonempty >= 0 && suppliedTitle) {
                const plain = line => line.replace(/^\s*#{1,6}\s*/, '').replace(/^\*\*/, '').replace(/\*\*$/, '').trim().toLowerCase();
                firstLineIsTitle = plain(lines[firstNonempty]) === plain(suppliedTitle);
              }
              if (firstLineIsTitle) lines.splice(firstNonempty, 1);

              const isHeading = line => {
                if (!line || line.length > 150) return false;
                if (/^#{1,6}\s+\S/.test(line)) return true;
                if (/^(?:\*\*|__)[^*\n]{3,130}(?:\*\*|__)$/.test(line)) return true;
                if (/^(?:🥉|🥈|🥇|💎|👑)\s*(?:Level|المستوى)\s*\d+\s*$/iu.test(line)) return true;
                if (/^(?:(?:Level|المستوى)\s*\d+)\s*[:：]?$/iu.test(line)) return true;
                if (/[:：]\s*$/.test(line) && !/^https?:/i.test(line) && line.length <= 100) return true;
                const letters = line.replace(/^[^A-Za-z\u0600-\u06FF]*/u, '');
                return /^[A-Z][A-Z0-9\s|&+.,'’()\-/–—:]{7,130}$/.test(letters) && /[A-Z]{3}/.test(letters);
              };
              const asHeading = line => line.replace(/^#{1,6}\s+/, '')
                .replace(/^\*\*/, '').replace(/\*\*$/, '').replace(/^__/, '').replace(/__$/, '').trim()
                .replace(/[:：]\s*$/, '').trim();

              const initial = [];
              const groups = [];
              let current = null;
              function pushGroup() {
                if (current) groups.push(current);
                current = null;
              }
              for (const line of lines) {
                if (!line) continue;
                if (isHeading(line)) {
                  pushGroup();
                  current = {heading:asHeading(line), paragraphs:[]};
                } else if (current) {
                  current.paragraphs.push(paragraph(line));
                } else {
                  initial.push(line);
                }
              }
              pushGroup();

              // Keep all supplied information, even when the text has no headings.
              if (!groups.length) {
                const introLine = initial.shift() || '';
                return {
                  intro: introLine,
                  sections: [{heading:'المعلومات المقدمة', paragraphs:[paragraph(initial.join('\n') || introLine)]}]
                };
              }
              for (const group of groups) {
                if (!group.paragraphs.length) group.paragraphs = [paragraph(group.heading)];
              }
              return {intro:initial.join('\n') || groups[0].paragraphs[0]?.text || '', sections:groups};
            }

            const knowledgeToArticleButton = el('knowledge-create-article-button');
            if (knowledgeToArticleButton) {
              knowledgeToArticleButton.addEventListener('click', async () => {
                const text = el('knowledge-text')?.value?.trim() || '';
                const inputTitle = el('knowledge-title')?.value?.trim() || '';
                const approval = el('knowledge-public-confirm')?.checked === true;
                const message = el('knowledge-message');
                const feedback = (content, kind='warning') => {
                  if (!message) return;
                  message.textContent = content;
                  message.className = 'message ' + kind;
                };
                if (text.length < 30) {
                  feedback('أدخل معلومات لا تقل عن 30 حرفًا قبل نقلها إلى المقالة.');
                  return;
                }
                if (!approval) {
                  feedback('راجع النص وأكد أنه لا يحتوي على معلومات سرية قبل المتابعة.');
                  return;
                }
                const first = text.split(/\r?\n/).map(x => x.trim()).find(Boolean) || '';
                const title = (inputTitle || first.replace(/^#{1,6}\s*/, '') || 'Apex Network Update').slice(0,180);
                const parsed = knowledgeSections(text, title);
                const description = ((parsed.intro || parsed.sections[0]?.paragraphs[0]?.text || text)
                  .replace(/\s+/g,' ').slice(0,350)).trim();
                const article = emptyArticle();
                article.title = title;
                article.description = description.length >= 8 ? description : (title + ' — Apex Network update');
                article.category = 'APXN News';
                article.status = 'draft';
                article.content.title = article.title;
                article.content.description = article.description;
                article.content.intro = paragraph(parsed.intro);
                article.content.sections = parsed.sections;
                article.content.conclusion = paragraph('');
                article.content.keywords = ['APXN', 'Apex Network'];
                article.keywords = article.content.keywords;

                try {
                  await openEditor(null);
                  studio.article = clone(article);
                  fillForm(article);
                  msg('تم نقل العنوان والأقسام إلى إنشاء مقالة جديدة. راجع النص وأكمل الخاتمة، ثم اضغط حفظ التعديلات لحفظ المسودة في GitHub أو حفظ ونشر عند الجاهزية. لم تُرسل هذه المعلومات إلى الكاتب الآلي.');
                  el('apxn-studio-title')?.focus();
                } catch (error) {
                  feedback(error?.message || 'تعذر فتح محرر المقالة.');
                }
              });
            }
            /* APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: END */
          '''

          START = '  /* APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: BEGIN */'
          END = '  /* APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: END */'
          if START in html:
              html, n = re.subn(re.escape(START) + r'[\s\S]*?' + re.escape(END), lambda _: BRIDGE_JS.strip(), html, count=1)
              assert n == 1
          else:
              anchor = '  install();\n})();\n</script>\n<!-- APXN_ARTICLE_STUDIO_V1: END -->'
              assert html.count(anchor) == 1, 'Original article studio closing anchor not found'
              html = html.replace(anchor, BRIDGE_JS + '\n' + anchor, 1)

          assert html.count('id="knowledge-save-button"') == 1
          assert html.count('id="knowledge-create-article-button"') == 1
          assert html.count('APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: BEGIN') == 1
          assert html.count('APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: END') == 1
          assert html.count('APXN_ARTICLE_STUDIO_V1: BEGIN') == 1
          assert html.count('id="login-form"') == 1
          assert html.count('id="knowledge-form"') == 1
          assert html.count("'/api/blog-admin-knowledge'") == 1
          assert html.count('id="articles"') == 1

          TARGET.write_text(html, encoding='utf-8')
          print('UPDATED:', TARGET)
          print('LINES:', len(html.splitlines()))
          print('TWO SEPARATE BUTTONS: PRESENT')
          print('AUTO-WRITER SUBMISSION: UNCHANGED')
          print('ARTICLE STUDIO: PRESERVED')
          PY

      - name: Validate existing dashboard and new controls
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('blog-admin/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>', html)
          assert len(scripts) >= 2, 'Original scripts missing'
          Path('/tmp/apxn-knowledge-buttons.js').write_text(scripts[-1], encoding='utf-8')
          assert html.count('id="knowledge-save-button"') == 1
          assert html.count('id="knowledge-create-article-button"') == 1
          assert html.count('id="knowledge-form"') == 1
          assert html.count('id="login-form"') == 1
          assert "'/api/blog-admin-knowledge'" in html
          assert 'content?.sections' in html
          assert 'APXN_KNOWLEDGE_TO_ARTICLE_BRIDGE: END' in html
          print('Both actions present. Original authenticated writer form preserved.')
          PY
          node --check /tmp/apxn-knowledge-buttons.js
          git diff --check

      - name: Commit only blog admin dashboard
        run: |
          set -euo pipefail
          git config user.name "APXN Blog Bot"
          git config user.email "actions@github.com"
          git add blog-admin/index.html
          if git diff --cached --quiet; then
            echo "Two-button dashboard already installed."
            exit 0
          fi
          git commit -m "feat(blog-admin): separate manual article and AI writer knowledge saves"
          git pull --rebase origin cloudflare-migration
          git push origin HEAD:cloudflare-migration

