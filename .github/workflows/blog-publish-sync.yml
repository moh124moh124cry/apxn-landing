name: APXN Blog Publish Sync

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - cloudflare-migration
    paths:
      - "blog/articles/**"

permissions:
  contents: write

concurrency:
  group: apxn-blog-publish-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync-blog:
    name: Sync Blog Index and Sitemap
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare-migration' }}
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update selected branch
        run: |
          set -euo pipefail
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Validate required files
        run: |
          set -euo pipefail
          test -f scripts/blog-sync.mjs
          test -f data/blog-config.json
          test -f data/blog-articles.json

      - name: Validate JSON files
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('data/blog-config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('data/blog-articles.json','utf8'))"

      # The Cloudflare migration branch now serves the live apxn.network website.
      # Normalize old preview links in the manifest and published article HTML.
      # Keep the main branch behavior unchanged.
      - name: Prepare production article links
        if: ${{ github.ref == 'refs/heads/cloudflare-migration' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const production = 'https://apxn.network';
          const oldOrigins = [
            'https://apxn-landing.cherfaouimohamed377.workers.dev',
            'https://apxn-landing.apxn-network.workers.dev'
          ];
          const manifestPath = 'data/blog-articles.json';
          const original = fs.readFileSync(manifestPath, 'utf8');
          const manifest = JSON.parse(original);
          const published = Array.isArray(manifest.articles)
            ? manifest.articles.filter(article => article?.status === 'published')
            : [];

          function productionLinks(value) {
            if (typeof value !== 'string') return value;
            return oldOrigins.reduce(
              (result, origin) => result.replaceAll(origin, production),
              value
            );
          }

          function restorePublicIndexing(html) {
            return html.replace(/<meta\b[^>]*>/gi, tag => {
              if (!/\bname\s*=\s*["']robots["']/i.test(tag)) return tag;
              return tag.replace(
                /(\bcontent\s*=\s*["'])\s*noindex\s*,\s*nofollow\s*(["'])/i,
                '$1index, follow$2'
              );
            });
          }

          for (const article of published) {
            for (const field of ['url', 'published_url', 'image']) {
              article[field] = productionLinks(article[field]);
            }

            if (article.seo && typeof article.seo === 'object') {
              article.seo.canonical = productionLinks(article.seo.canonical);
              if (article.seo.robots === 'noindex, nofollow') {
                article.seo.robots = 'index, follow';
              }
            }

            if (article.indexable === false) article.indexable = true;

            const configuredPath = String(
              article.path || `blog/articles/${article.slug}.html`
            ).replace(/^\/+/, '');
            const articleFile = path.resolve(configuredPath);
            const articleFolder = path.resolve('blog/articles') + path.sep;

            if (!articleFile.startsWith(articleFolder) || !fs.existsSync(articleFile)) {
              throw new Error(`Published article file missing or invalid: ${configuredPath}`);
            }

            const before = fs.readFileSync(articleFile, 'utf8');
            const after = restorePublicIndexing(productionLinks(before));
            if (after !== before) fs.writeFileSync(articleFile, after, 'utf8');
          }

          const updated = `${JSON.stringify(manifest, null, 2)}\n`;
          if (updated !== original) fs.writeFileSync(manifestPath, updated, 'utf8');
          console.log(`Production links prepared for ${published.length} published articles.`);
          NODE

      - name: Rebuild blog index and sitemap
        run: |
          set -euo pipefail
          node scripts/blog-sync.mjs

      - name: Prepare production index and sitemap
        if: ${{ github.ref == 'refs/heads/cloudflare-migration' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const production = 'https://apxn.network';
          const oldOrigins = [
            'https://apxn-landing.cherfaouimohamed377.workers.dev',
            'https://apxn-landing.apxn-network.workers.dev'
          ];
          for (const filename of ['blog/index.html', 'sitemap.xml']) {
            const before = fs.readFileSync(filename, 'utf8');
            let after = oldOrigins.reduce(
              (result, origin) => result.replaceAll(origin, production),
              before
            );
            if (filename === 'blog/index.html') {
              after = after.replace(/<meta\b[^>]*>/gi, tag => {
                if (!/\bname\s*=\s*["']robots["']/i.test(tag)) return tag;
                return tag.replace(
                  /(\bcontent\s*=\s*["'])\s*noindex\s*,\s*nofollow\s*(["'])/i,
                  '$1index, follow$2'
                );
              });
            }
            if (after !== before) fs.writeFileSync(filename, after, 'utf8');
          }
          console.log('Production blog index and sitemap use apxn.network.');
          NODE

      - name: Check generated files
        run: |
          set -euo pipefail
          test -f blog/index.html
          test -f sitemap.xml

      - name: Commit synchronized blog files
        run: |
          set -euo pipefail
          git config user.name "APXN Blog Bot"
          git config user.email "actions@github.com"

          git add blog/index.html sitemap.xml
          if [ "${TARGET_BRANCH}" = "cloudflare-migration" ]; then
            git add data/blog-articles.json blog/articles
          fi

          if git diff --cached --quiet; then
            echo "Blog index and sitemap are already synchronized."
            exit 0
          fi

          git commit -m "Sync blog index and sitemap after publication"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## APXN Blog Publish Sync"
            echo ""
            echo "Branch: ${TARGET_BRANCH}"
            echo "The blog index and sitemap sync runs after manual publication or manual dispatch."
            echo "Cloudflare migration publishes canonical apxn.network links; main remains unchanged."
            echo "This workflow does not generate or publish articles automatically."
          } >> "$GITHUB_STEP_SUMMARY"

