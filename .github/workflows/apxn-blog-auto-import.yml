          required = ['apxn-studio-form', 'apxn-studio-image-input',
                      'apxn-studio-save', 'apxn-studio-publish']
          missing = [marker for marker in required if marker not in original]
          if missing:
              raise RuntimeError('Existing article studio not found: ' + ', '.join(missing))
