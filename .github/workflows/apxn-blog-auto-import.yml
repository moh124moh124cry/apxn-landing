name: APXN Blog - Automatic Article Import

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - ".github/workflows/apxn-blog-auto-import.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apxn-blog-auto-import-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  install-automatic-article-import:
    if: ${{ github.ref == 'refs/heads/cloudflare-migration' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APXN website branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-migration
          fetch-depth: 0

      - name: Install automatic article importer into existing APXN editor
