          javascript = base64.b64decode(encoded).decode('utf-8')
          begin = '<!-- APXN_AUTO_ARTICLE_IMPORT_V2: BEGIN -->'
          end = '<!-- APXN_AUTO_ARTICLE_IMPORT_V2: END -->'
          injected = begin + '\n<script id="apxn-auto-article-import-v2">\n' + javascript + '\n</script>\n' + end

          if begin in original or end in original:
              pattern = re.compile(re.escape(begin) + r'[\s\S]*?' + re.escape(end))
              if len(pattern.findall(original)) != 1:
                  raise RuntimeError('Unexpected importer markers; refusing unsafe replacement.')
              result = pattern.sub(lambda _: injected, original, count=1)
          else:
              matches = list(re.finditer(r'</body\s*>', original, flags=re.I))
              if len(matches) != 1:
                  raise RuntimeError('Cannot find unique closing body tag; refusing unsafe injection.')
              index = matches[0].start()
              result = original[:index] + injected + '\n' + original[index:]
          if result != original:
              admin.write_text(result, encoding='utf-8')
              print('Installed auto-import UI into blog-admin/index.html')
          else:
              print('Auto importer already up-to-date')
          print('Existing publish API, article templates, and image handler remain unchanged.')
          PYCODE

      - name: Commit only the updated APXN admin editor
        shell: bash
        run: |
          set -euo pipefail
          git add blog-admin/index.html
          if git diff --cached --quiet; then
            echo "No code changes needed."
            exit 0
          fi
          git config user.name "APXN Blog Automation"
          git config user.email "actions@github.com"
          git commit -m "feat(blog-admin): auto split pasted articles into blog fields"
          git pull --rebase origin cloudflare-migration
          git push origin HEAD:cloudflare-migration

