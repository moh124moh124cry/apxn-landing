          addon=base64.b64decode(encoded).decode("utf-8")
          begin="<!-- APXN_ARTICLE_STUDIO_V1: BEGIN -->"
          end="<!-- APXN_ARTICLE_STUDIO_V1: END -->"

          if begin in source or end in source:
              assert source.count(begin)==1 and source.count(end)==1, "Previous patch markers damaged"
              source=re.sub(re.escape(begin)+r"[\s\S]*?"+re.escape(end),lambda _match: addon.strip(),source,count=1)
          else:
              assert "</body>" in source and 'id="admin-screen"' in source, "Unexpected admin HTML"
              source=source.replace("</body>",addon+"\n</body>",1)

          assert source.count('id="login-form"')==1, "Existing login was changed"
          assert source.count('id="knowledge-form"')==1, "Knowledge form was changed"
          assert source.count('id="articles"')==1, "Article list was changed"
          assert source.count(begin)==1 and source.count(end)==1
          target.write_text(source,encoding="utf-8")
          print("UPGRADED:",target)
          print("LINES:",len(source.splitlines()))
          print("Login, existing listing, knowledge form: preserved")
          print("New article studio: installed")
          PY

      - name: Check JavaScript and HTML markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("blog-admin/index.html").read_text(encoding="utf8")
          scripts=re.findall(r'<script(?:\s+[^>]*)?>([\s\S]*?)</script>',html)
          Path("/tmp/apxn-admin-new-ui.js").write_text(scripts[-1],encoding="utf8")
          assert 'id="apxn-studio-create"' not in html  # Created dynamically in the browser
          assert 'id="apxn-studio-overlay"' not in html  # Also created dynamically
          assert html.count('APXN_ARTICLE_STUDIO_V1: BEGIN')==1
          print("Embedded scripts:",len(scripts))
          PY
          node --check /tmp/apxn-admin-new-ui.js
          git diff --check

      - name: Commit only the first admin file
        run: |
          set -euo pipefail
          git config user.name "APXN Blog Bot"
          git config user.email "actions@github.com"
          git add blog-admin/index.html
          if git diff --cached --quiet; then
            echo "The APXN admin UI is already installed."
            exit 0
          fi
          git commit -m "feat(blog-admin): add article create, edit, image, preview and delete UI"
          git pull --rebase origin cloudflare-migration
          git push origin HEAD:cloudflare-migration

