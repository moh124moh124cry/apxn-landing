name: APXN Blog Ready Articles

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * 1"
    - cron: "0 8 * * 3"
    - cron: "0 8 * * 6"


permissions:
  contents: write


concurrency:
  group: apxn-blog-ready-writer
  cancel-in-progress: false


jobs:
  generate-ready-article:

    name: Generate Ready Blog Article

    runs-on: ubuntu-latest

    timeout-minutes: 20


    env:
      TZ: "Africa/Algiers"


    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0


      # ============================================
      # NODE
      # ============================================

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false


      # ============================================
      # VALIDATE FILES
      # ============================================

      - name: Validate blog scripts
        run: |
          set -euo pipefail

          node --check scripts/blog-writer.mjs
          node --check scripts/blog-ready-writer.mjs
          node --check scripts/blog-researcher.mjs
          node --check scripts/blog-planner.mjs


      # ============================================
      # VALIDATE JSON
      # ============================================

      - name: Validate blog JSON
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'

          import fs from "node:fs";


          const files = [
            "data/blog-config.json",
            "data/blog-articles.json",
            "data/blog-topic-bank.json",
            "data/blog-source-profiles.json",
            "data/apxn-blog-knowledge.json"
          ];


          for (const file of files) {

            const raw =
              fs.readFileSync(
                file,
                "utf8"
              );


            JSON.parse(
              raw
            );


            console.log(
              `JSON OK: ${file}`
            );
          }

          NODE


      # ============================================
      # CHECK SETTINGS
      # ============================================

      - name: Check automatic generation
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail

          AUTO_GENERATE="$(node -e "
            const fs = require('fs');

            const config =
              JSON.parse(
                fs.readFileSync(
                  'data/blog-config.json',
                  'utf8'
                )
              );

            process.stdout.write(
              String(
                config?.automation?.auto_generate_enabled === true
              )
            );
          ")"


          AUTO_PUBLISH="$(node -e "
            const fs = require('fs');

            const config =
              JSON.parse(
                fs.readFileSync(
                  'data/blog-config.json',
                  'utf8'
                )
              );

            process.stdout.write(
              String(
                config?.automation?.auto_publish_enabled === true
              )
            );
          ")"


          echo "Auto generate: $AUTO_GENERATE"
          echo "Auto publish: $AUTO_PUBLISH"


          if [ "$AUTO_GENERATE" != "true" ]; then

            echo "Automatic article generation is disabled."

            exit 1
          fi


          if [ "$AUTO_PUBLISH" = "true" ]; then

            echo "::error::Automatic publishing must remain disabled."

            exit 1
          fi


          if [ -z "$XAI_API_KEY" ]; then

            echo "::error::XAI_API_KEY is missing from GitHub Secrets."

            exit 1
          fi


          echo "Generation configuration PASS"
          echo "Automatic publishing remains OFF"


      # ============================================
      # TOPIC PLANNER
      # ============================================

      - name: Prepare article topic
        run: |
          set -euo pipefail

          node scripts/blog-planner.mjs


      # ============================================
      # GENERATE READY ARTICLE
      # ============================================

      - name: Generate ready article
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail

          unset BLOG_PUBLISH || true

          node scripts/blog-ready-writer.mjs


      # ============================================
      # VERIFY RESULT
      # ============================================

      - name: Verify ready article
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'

          import fs from "node:fs";


          const manifest =
            JSON.parse(
              fs.readFileSync(
                "data/blog-articles.json",
                "utf8"
              )
            );


          const articles =
            Array.isArray(
              manifest.articles
            )
              ? manifest.articles
              : [];


          const ready =
            articles.filter(
              article =>
                article?.status ===
                "ready"
            );


          if (
            ready.length === 0
          ) {

            throw new Error(
              "No ready article was found after generation."
            );
          }


          const newest =
            ready[
              ready.length - 1
            ];


          if (
            !newest?.title ||
            !newest?.slug ||
            !newest?.content
          ) {

            throw new Error(
              "Generated ready article is incomplete."
            );
          }


          if (
            newest?.status !==
            "ready"
          ) {

            throw new Error(
              "Generated article is not in ready status."
            );
          }


          if (
            newest?.published_at
          ) {

            throw new Error(
              "Ready article must not have a publication date."
            );
          }


          console.log(
            "Ready article verified:"
          );

          console.log(
            newest.title
          );

          console.log(
            `Category: ${newest.category}`
          );

          console.log(
            `Words: ${newest.word_count}`
          );

          console.log(
            "Published: NO"
          );

          NODE


      # ============================================
      # COMMIT READY ARTICLE
      # ============================================

      - name: Commit ready article
        run: |
          set -euo pipefail

          git config \
            user.name \
            "APXN Blog Bot"

          git config \
            user.email \
            "actions@users.noreply.github.com"


          git add \
            data/blog-articles.json \
            data/blog-topic-bank.json \
            data/blog-costs.json


          if git diff --cached --quiet; then

            echo "No article changes to commit."

            exit 0
          fi


          git commit \
            -m "chore(blog): add ready article"


          git push origin main


      # ============================================
      # SUMMARY
      # ============================================

      - name: Workflow summary
        run: |
          echo "### APXN Blog" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Article generation completed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ SEO and quality checks completed" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Article saved as ready" >> "$GITHUB_STEP_SUMMARY"
          echo "❌ Automatic publishing disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open /blog-admin/ to review the article, add an image and publish it." >> "$GITHUB_STEP_SUMMARY"
