name: APXN Blog Writer

on:
  push:
    branches: [main]
    paths: [data/blog-config.json]

  workflow_dispatch:
    inputs:
      sync_only:
        description: "Rebuild blog index and sitemap without calling xAI"
        required: false
        default: false
        type: boolean

      planner_only:
        description: "Test and update the topic planner without calling xAI"
        required: false
        default: false
        type: boolean

      writer_test:
        description: "Generate one private Grok draft to test xAI without publishing"
        required: false
        default: false
        type: boolean

      source_test:
        description: "Test direct official sources without calling xAI"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "0 8 * * 1"
    - cron: "0 8 * * 3"
    - cron: "0 8 * * 6"

permissions:
  contents: write

concurrency:
  group: apxn-blog-writer
  cancel-in-progress: false

jobs:
  blog:
    name: Generate and publish APXN article
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: "Africa/Algiers"

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Validate blog scripts
        run: |
          node --check scripts/blog-writer.mjs
          node --check scripts/blog-sync.mjs
          node --check scripts/blog-planner.mjs

      - name: Validate manual mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          COUNT=0

          if [ "${{ inputs.sync_only }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi

          if [ "${{ inputs.planner_only }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi

          if [ "${{ inputs.writer_test }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi

          if [ "${{ inputs.source_test }}" = "true" ]; then
            COUNT=$((COUNT + 1))
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "Choose only one manual mode:"
            echo "- sync_only"
            echo "- planner_only"
            echo "- writer_test"
            echo "- source_test"
            exit 1
          fi

      - name: Replenish topic queue
        id: planner
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.sync_only && !inputs.source_test) }}
        run: node scripts/blog-planner.mjs

      - name: Check automation readiness
        id: gate
        if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.sync_only && !inputs.planner_only && !inputs.writer_test && !inputs.source_test) }}
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          AUTO_GENERATE="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('data/blog-config.json','utf8'));process.stdout.write(String(c?.automation?.auto_generate_enabled===true));")"

          WAITING_COUNT="$(node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('data/blog-articles.json','utf8'));process.stdout.write(String((m?.generation_queue||[]).filter(x=>x?.status==='waiting').length));")"

          READY=true
          REASON=ready

          if [ "$AUTO_GENERATE" != "true" ]; then
            READY=false
            REASON=automation_disabled
          elif [ "$WAITING_COUNT" = "0" ]; then
            READY=false
            REASON=no_waiting_topics
          elif [ -z "$XAI_API_KEY" ]; then
            READY=false
            REASON=xai_key_missing
            echo "::error::XAI_API_KEY is missing"
            exit 1
          fi

          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "waiting_count=$WAITING_COUNT" >> "$GITHUB_OUTPUT"

          if [ "$READY" = "true" ]; then
            echo "APXN Blog automation is ready."
          else
            echo "APXN Blog automation skipped safely: $REASON"
          fi

      - name: Sync blog only
        id: sync_only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_only && !inputs.planner_only && !inputs.writer_test && !inputs.source_test }}
        continue-on-error: true
        run: node scripts/blog-sync.mjs

      - name: Test all direct official source profiles
        id: source_test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_test && !inputs.sync_only && !inputs.planner_only && !inputs.writer_test }}
        continue-on-error: true
        shell: bash
        env:
          BLOG_SOURCE_TEST: "true"
          BLOG_PUBLISH: "false"
        run: |
          set -euo pipefail

          MANIFEST="data/blog-articles.json"
          BACKUP="$RUNNER_TEMP/blog-articles.source-test.backup.json"

          cp "$MANIFEST" "$BACKUP"

          restore_manifest() {
            cp "$BACKUP" "$MANIFEST"
          }

          trap restore_manifest EXIT

          TESTS=(
            "bsc|What Is BSC? Understanding BEP-20 Tokens and Gas Fees|BSC"
            "telegram_auth|How Telegram Mini App Authentication and initData Verification Work|Security"
            "telegram_web3|How Telegram Mini Apps Bring Web3 to Everyday Users|Web3"
            "security|Web3 Security Basics: Phishing, Private Keys, Seed Phrases and MFA|Security"
            "ethereum|Ethereum, the EVM and Smart Contracts Explained|Blockchain"
            "blockchain|Blockchain Explained: Blocks, Transactions and Consensus|Blockchain"
            "web3|What Is Web3? Decentralized Applications and dApps Explained|Web3"
          )

          for ITEM in "${TESTS[@]}"; do
            IFS='|' read -r TEST_ID TEST_TOPIC TEST_CATEGORY <<< "$ITEM"

            echo "::group::Source profile test: $TEST_ID"
            echo "Test topic: $TEST_TOPIC"

            TEST_ID="$TEST_ID"             TEST_TOPIC="$TEST_TOPIC"             TEST_CATEGORY="$TEST_CATEGORY"             node <<'NODE'
          const fs = require("fs");

          const manifestPath = "data/blog-articles.json";
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));

          manifest.generation_queue = [
            {
              id: `source-test-${process.env.TEST_ID}`,
              topic: process.env.TEST_TOPIC,
              category: process.env.TEST_CATEGORY,
              language: "en",
              priority: 1,
              status: "waiting",
              verify_before_publish: false,
              blocked_auto_publish: false
            }
          ];

          fs.writeFileSync(
            manifestPath,
            `${JSON.stringify(manifest, null, 2)}\n`,
            "utf8"
          );
          NODE

            node scripts/blog-writer.mjs
            echo "::endgroup::"
          done

          echo "All direct official source profiles passed."
          echo "No xAI API key was exposed to this step and no xAI API call was made."

      - name: Generate private Grok test draft
        id: writer_test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.writer_test && !inputs.sync_only && !inputs.planner_only && !inputs.source_test }}
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BLOG_PUBLISH: "false"
        run: node scripts/blog-writer.mjs

      - name: Generate article with Grok
        id: writer
        if: ${{ steps.gate.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          BLOG_PUBLISH: "true"
        run: node scripts/blog-writer.mjs

      - name: Upload private draft artifact
        if: ${{ always() && (steps.writer_test.outcome == 'success' || steps.writer_test.outcome == 'failure' || steps.writer.outcome == 'success' || steps.writer.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: apxn-private-draft-${{ github.run_number }}
          path: .workflow-output/drafts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Sync blog index and sitemap
        id: sync
        if: ${{ steps.writer.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/blog-sync.mjs

      - name: Commit successful blog update
        id: commit
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sync_only && steps.sync_only.outcome == 'success') || (github.event_name == 'workflow_dispatch' && inputs.planner_only && steps.planner.outcome == 'success') || (steps.writer.outcome == 'success' && steps.sync.outcome == 'success') }}
        shell: bash
        run: |
          git config user.name "APXN Blog Bot"
          git config user.email "actions@users.noreply.github.com"

          git add blog data sitemap.xml

          if git diff --cached --quiet; then
            echo "No blog changes to commit."
            exit 0
          fi

          git commit -m "chore(blog): automated content update"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify published article on production
        if: ${{ steps.writer.outcome == 'success' && steps.sync.outcome == 'success' && steps.commit.outputs.sha != '' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const manifest = JSON.parse(fs.readFileSync("data/blog-articles.json", "utf8"));
          const article = manifest.articles.find(item => item.id === manifest.automation_state.last_published_article);
          if (!article || article.status !== "published" || !article.path) throw new Error("No published article found");
          const expected = fs.readFileSync(article.path, "utf8");
          const digest = text => crypto.createHash("sha256").update(text).digest("hex");
          const base = new URL(article.url).origin;
          let lastError;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              const [page, index, sitemap] = await Promise.all([
                fetch(article.url, { signal: AbortSignal.timeout(15000), cache: "no-store" }),
                fetch(`${base}/blog/`, { signal: AbortSignal.timeout(15000), cache: "no-store" }),
                fetch(`${base}/sitemap.xml`, { signal: AbortSignal.timeout(15000), cache: "no-store" })
              ]);
              if (![page, index, sitemap].every(response => response.ok)) throw new Error("Production files are not ready");
              const [html, listing, xml] = await Promise.all([page.text(), index.text(), sitemap.text()]);
              if (digest(html) !== digest(expected)) throw new Error("Production article does not match committed HTML yet");
              if (!listing.includes(article.slug) || !xml.includes(article.url)) throw new Error("Production index or sitemap is not updated yet");
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Published and verified: ${article.url}\n\nWords: ${article.word_count}\n`);
              console.log(`Published article, index and sitemap verified: ${article.url}`);
              process.exit(0);
            } catch (error) { lastError = error; }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw lastError;
          NODE

      - name: Preserve writer test API cost only
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.writer_test && (steps.writer_test.outcome == 'success' || steps.writer_test.outcome == 'failure') }}
        shell: bash
        run: |
          git config user.name "APXN Blog Bot"
          git config user.email "actions@users.noreply.github.com"

          if [ ! -f data/blog-costs.json ]; then
            echo "No xAI cost ledger was created."

            git reset --hard HEAD
            git clean -fd

            exit 0
          fi

          git add data/blog-costs.json

          if git diff --cached --quiet; then
            echo "No xAI cost change to commit."

            git reset --hard HEAD
            git clean -fd

            exit 0
          fi

          git commit -m "chore(blog): record Grok test usage"

          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preserve costs and rejected queue after failed pipeline
        if: ${{ steps.writer.outcome == 'failure' || (steps.writer.outcome == 'success' && steps.sync.outcome == 'failure') }}
        shell: bash
        run: |
          if [ ! -f data/blog-costs.json ]; then
            echo "No xAI cost ledger was created."
            exit 0
          fi

          git config user.name "APXN Blog Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/blog-costs.json
          if [ "${{ steps.writer.outcome }}" = "failure" ]; then
            git add data/blog-articles.json data/blog-topic-bank.json
          fi

          if git diff --cached --quiet; then
            echo "No cost or queue change to commit."
            exit 0
          fi

          git commit -m "chore(blog): record xAI usage"

          git reset --hard HEAD
          git clean -fd

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if source test failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_test && steps.source_test.outcome == 'failure' }}
        run: |
          echo "The direct official source test failed."
          echo "No xAI API request was required for this test."
          exit 1

      - name: Fail if writer test failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.writer_test && steps.writer_test.outcome == 'failure' }}
        run: |
          echo "The private Grok test failed."
          echo "Check the Generate private Grok test draft step for details."
          exit 1

      - name: Fail if generation failed
        if: ${{ steps.writer.outcome == 'failure' }}
        run: |
          echo "The Grok writer failed. Any available cost ledger update was preserved."
          exit 1

      - name: Fail if synchronization failed
        if: ${{ steps.writer.outcome == 'success' && steps.sync.outcome == 'failure' }}
        run: |
          echo "The article was not committed because blog synchronization failed."
          exit 1

      - name: Fail if manual sync failed
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_only && steps.sync_only.outcome == 'failure' }}
        run: |
          echo "Manual blog synchronization failed."
          exit 1


